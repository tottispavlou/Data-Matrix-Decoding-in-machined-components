datamatrix-decoder/
│
├── data/                          # All input/output image data
│   ├── raw/                       # Original collected images
│   ├── synthetic/                 # Generated pin-head datasets
│   ├── processed/                 # Intermediate aligned/filtered images
│   └── results/                   # Final outputs, decoded data, CSV logs
│
├── python/                        # Python code (prototype, dataset, ML, orchestration)
│   ├── baseline_eval.py           # Yesterday's script: run libdmtx, log CSV
│   ├── dataset_generator.py       # Synthetic pin-head generator
│   ├── preprocessing.py           # Filtering, normalization, simple OpenCV ops
│   ├── pipeline.py                # End-to-end Python pipeline
│   ├── train_model.py             # Train ML models (e.g., pin detection, correction)
│   ├── inference.py               # Run trained models (via ONNXRuntime)
│   └── utils.py                   # Shared helpers (CSV logging, visualization, etc.)
│
├── cpp/                           # C++ modules for speed-critical steps
│   ├── CMakeLists.txt             # Build config
│   ├── include/                   # Headers
│   │   ├── localization.hpp       # Detect candidate DataMatrix regions
│   │   ├── alignment.hpp          # Grid fitting, perspective correction
│   │   ├── blob_detect.hpp        # Pin detection, clustering
│   │   └── bindings.hpp           # Pybind11 bindings
│   ├── src/                       # Implementations
│   │   ├── localization.cpp
│   │   ├── alignment.cpp
│   │   ├── blob_detect.cpp
│   │   └── bindings.cpp           # Expose to Python
│   └── tests/                     # Unit tests (GoogleTest / Catch2)
│
├── models/                        # Trained ML models
│   ├── pin_detector.onnx          # Example: pin vs. no-pin classifier
│   └── grid_corrector.onnx
│
├── notebooks/                     # Jupyter notebooks for prototyping & visualization
│   ├── explore_data.ipynb         # Look at raw vs synthetic images
│   ├── test_pipeline.ipynb        # Run partial pipelines interactively
│   └── visualize_results.ipynb    # Plot benchmarks, decoded outputs
│
├── logs/                          # Benchmark + debug logs
│   ├── baseline_results.csv
│   └── perf_tests.csv
│
├── README.md                      # Documentation & setup guide
└── requirements.txt               # Python dependencies
